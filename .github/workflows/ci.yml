name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -q
      - name: Evals (fail if lease recall drops below 95%)
        run: python -m leaseguard eval --min-recall 0.95

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t leaseguard .
      - name: Run and check /health
        run: |
          docker run -d -p 8000:8000 --name lc leaseguard
          for i in $(seq 1 20); do
            if curl -fs http://localhost:8000/health; then echo; exit 0; fi
            sleep 2
          done
          docker logs lc
          exit 1
