services:
  api:
    build: .
    ports: ["8000:8000"]
    env_file: [{path: .env, required: false}]
  web:
    image: python:3.12-slim
    working_dir: /app
    volumes: [".:/app"]
    ports: ["8501:8501"]
    env_file: [{path: .env, required: false}]
    command: sh -c "pip install -q -r requirements.txt && streamlit run app/streamlit_app.py --server.address 0.0.0.0"
